'use strict';
const CATS=[
 {id:'orange',name:'橘子',description:'干饭型选手',coat:'#eab078',colors:{fur:'#e7a461','fur-light':'#f6c58b','fur-shadow':'#ce8644',stripe:'#bc743c',ear:'#edb2a0',sock:'#f8ddb2',outline:'#9b6037',blob:'#f2e3cb'}},
 {id:'calico',name:'花卷',description:'花色不重样',coat:'conic-gradient(#d99b60 0deg 120deg,#f1e9dc 120deg 240deg,#4c4846 240deg)',colors:{fur:'#eee7d9','fur-light':'#fcf7ed','fur-shadow':'#c8ba9f',stripe:'#b77c49',ear:'#e3b1a3',sock:'#fbf5e9',outline:'#a18d72',blob:'#e7e6d6'}},
 {id:'gray',name:'芝麻',description:'扭扭很有分寸',coat:'#a1a6ac',colors:{fur:'#9da5ab','fur-light':'#c1c8cb','fur-shadow':'#7f8992',stripe:'#66717e',ear:'#d5a8aa',sock:'#cdd1cf',outline:'#68727c',blob:'#e1e7e8'}},
 {id:'white',name:'年糕',description:'软乎乎一小团',coat:'#f1ede4',colors:{fur:'#eee9df','fur-light':'#fffdf5','fur-shadow':'#c5bcab',stripe:'#c6b8a4',ear:'#edc0b2',sock:'#fffaf0',outline:'#b4a692',blob:'#eee2dc'}},
 {id:'tuxedo',name:'煤球',description:'穿西装也要扭',coat:'linear-gradient(140deg,#41434b 65%,#f7f2e7 65%)',colors:{fur:'#45464e','fur-light':'#666773','fur-shadow':'#292c35',stripe:'#353741',ear:'#c99899',sock:'#f7f2e7',outline:'#242832',blob:'#e4e3ea'}},
 {id:'siamese',name:'拿铁',description:'自带咖啡拉花',coat:'radial-gradient(circle at 65% 70%,#726257 30%,#e8d5b8 75%)',colors:{fur:'#ddc7a7','fur-light':'#f4e5ca','fur-shadow':'#b39b7b',stripe:'#726257',ear:'#c79f94',sock:'#807064',outline:'#8f775e',blob:'#eadfcf'}}
];
const $=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let active=0,count=0,soundOn=false,audio=null,energy=0,phase=0,previous=0,frame=0,bubbleTimer=0,phraseIndex=0;
const phrases=['收到！扭给你看。','生活嘛，扭过去就好。','这不是胖，是快乐的形状。','你负责开心，我负责扭。','好的，再来亿次。','烦恼已被尾巴扫走。'];
try{const stored=Number(localStorage.getItem('wiggle-club-count'));if(Number.isSafeInteger(stored)&&stored>=0&&stored<1e9)count=stored;const id=localStorage.getItem('wiggle-club-cat');const index=CATS.findIndex(cat=>cat.id===id);if(index>=0)active=index;}catch{}
function store(key,value){try{localStorage.setItem(key,String(value));}catch{}}
function renderCount(){$('count').textContent=String(count).padStart(3,'0');}
for(const [index,cat] of CATS.entries()){
 const button=document.createElement('button');button.type='button';button.className='cat-choice';button.dataset.cat=cat.id;button.setAttribute('aria-label',cat.name+'，'+cat.description);button.setAttribute('aria-pressed','false');button.title=cat.name;
 const dot=document.createElement('span');dot.className='coat-dot';dot.style.setProperty('--coat',cat.coat);dot.setAttribute('aria-hidden','true');button.append(dot);button.addEventListener('click',()=>setCat(index,true));$('cats').append(button);
}
function resetPose(){for(const id of ['hips','head','tail'])$(id).removeAttribute('transform');$('scene').classList.remove('is-wiggling');}
function stopWiggle(){if(frame)cancelAnimationFrame(frame);frame=0;energy=0;previous=0;phase=0;resetPose();}
function setCat(index,announce=false){
 stopWiggle();active=(index+CATS.length)%CATS.length;const cat=CATS[active];document.body.dataset.cat=cat.id;
 for(const [key,value] of Object.entries(cat.colors))document.documentElement.style.setProperty('--'+key,value);
 $('cat-name').textContent=cat.name;$('cat-description').textContent=cat.description;$('pet').setAttribute('aria-label','点击'+cat.name+'，让小猫扭屁股');
 $('cats').querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===active)));store('wiggle-club-cat',cat.id);
 if(announce){showBubble('换班啦，今天是'+cat.name+'！');$('announcement').textContent='已切换为'+cat.name+'，'+cat.description;}
}
function showBubble(text){clearTimeout(bubbleTimer);$('bubble').textContent=text;$('bubble').classList.add('visible');bubbleTimer=setTimeout(()=>$('bubble').classList.remove('visible'),2000);}
function animate(time){
 if(document.hidden){stopWiggle();return;}
 const dt=previous?Math.min((time-previous)/1000,.045):1/60;previous=time;phase+=dt*18;energy=Math.max(0,energy-dt*.88);
 const scale=reduced.matches ? .15 : 1,angle=Math.sin(phase)*energy*10*scale,shift=Math.sin(phase)*energy*9*scale;
 $('hips').setAttribute('transform',`translate(${shift.toFixed(3)} 0) rotate(${angle.toFixed(3)} 330 380)`);
 $('head').setAttribute('transform',`rotate(${(-angle*.22).toFixed(3)} 330 300)`);
 $('tail').setAttribute('transform',`rotate(${(Math.sin(phase-1)*energy*14*scale).toFixed(3)} 332 491)`);
 if(energy>.01)frame=requestAnimationFrame(animate);else{frame=0;previous=0;resetPose();}
}
function addSpark(){
 if(reduced.matches||$('scene').querySelectorAll('.floater').length>=10)return;
 const svg=$('pet').querySelector('svg').getBoundingClientRect(),scene=$('scene').getBoundingClientRect();
 const spark=document.createElement('span');spark.className='floater';spark.setAttribute('aria-hidden','true');spark.textContent=['♡','✦','♪'][count%3];spark.style.left=(svg.left-scene.left+svg.width*(.35+Math.random()*.3))+'px';spark.style.top=(svg.top-scene.top+svg.height*.65)+'px';spark.style.setProperty('--drift',(Math.random()*70-35)+'px');$('scene').append(spark);spark.addEventListener('animationend',()=>spark.remove(),{once:true});setTimeout(()=>spark.remove(),1200);
}
async function playSound(){
 if(!soundOn)return;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('Audio unavailable');
  if(!audio)audio=new Audio();if(audio.state==='suspended')await audio.resume();
  const oscillator=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;oscillator.type='sine';const note=[523.25,659.25,783.99,880][count%4];oscillator.frequency.setValueAtTime(note,now);oscillator.frequency.exponentialRampToValueAtTime(note*.75,now+.16);gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.09,now+.008);gain.gain.exponentialRampToValueAtTime(.001,now+.24);oscillator.connect(gain);gain.connect(audio.destination);oscillator.start(now);oscillator.stop(now+.25);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
 }catch{soundOn=false;renderSound();showBubble('音效暂不可用，安静扭扭也开心。');}
}
function wiggle(){count=Math.min(count+1,999999999);renderCount();store('wiggle-club-count',count);energy=Math.min(energy+.95,1.45);$('scene').classList.add('is-wiggling');if(!frame){previous=0;phase=0;frame=requestAnimationFrame(animate);}showBubble(phrases[phraseIndex++%phrases.length]);$('announcement').textContent=CATS[active].name+'扭了扭屁股，累计'+count+'次。';addSpark();void playSound();}
function renderSound(){$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').setAttribute('aria-label',soundOn?'关闭音效':'开启音效');$('sound').title=soundOn?'关闭音效':'开启音效';}
$('pet').addEventListener('click',wiggle);$('next').addEventListener('click',()=>setCat(active+1,true));$('sound').addEventListener('click',()=>{soundOn=!soundOn;renderSound();if(soundOn)void playSound();});
document.addEventListener('keydown',event=>{
 if(event.altKey||event.ctrlKey||event.metaKey||event.isComposing)return;
 if(event.target!==document.body&&event.target!==$('pet'))return;
 if(event.code==='Space'&&event.target===document.body){event.preventDefault();if(!event.repeat)wiggle();}
 if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();if(!event.repeat)setCat(active+(event.key==='ArrowRight'?1:-1),true);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopWiggle();});
setCat(active);renderCount();
</script>
</body>
</html>
